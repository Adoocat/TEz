# Lint, type check and test on every PR and on main. Each job runs the same
# `pnpm check <group>` as local development (scripts/check.mjs), so CI has no logic of its own.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"] # oldest supported + the one we develop on
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3 # this action publishes no moving major tag
        with:
          python-version: ${{ matrix.python }} # sets UV_PYTHON, overriding backend/.python-version
          enable-cache: true
      - run: uv sync --locked --project backend
      - run: pnpm install --frozen-lockfile # pyright and openapi-typescript come from npm
      - run: pnpm check py api # api: the generated TS client matches the backend (Task 7)

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check web format

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --project backend
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and its system packages
        timeout-minutes: 10
        run: |
          # Ubuntu's main archive only: the runners' Azure apt mirror could not be resolved on
          # 2026-11-11, and apt then waits on it for every file.
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          pnpm --filter @tez/web exec playwright install --with-deps chromium
      - run: pnpm e2e # web mode against a real backend on a temporary library
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/check.mjs rust # no Node packages needed
        env:
          CARGO_TERM_COLOR: always
