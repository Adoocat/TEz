# Developer CLI for migrations, run from backend/:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate --rev-id 0002 -m "add papers"
# The app itself migrates with tez.core.migrations.migrate(), not with this file.

[alembic]
script_location = %(here)s/src/tez/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# Development database only (git-ignored); never a real library.
sqlalchemy.url = sqlite:///%(here)s/.dev/dev.sqlite

[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5s [%(name)s] %(message)s
