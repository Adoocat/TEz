        Zhejiang, China.\"}]}},{\"fullName\":\"Zhou D\",\"lastName\":\"Zhou\",\"firstName\":\"Dongsheng\",\"initials\":\"D\",\"authorId\":{\"type\":\"ORCID\",\"value\":\"0009-0002-9326-4242\"},\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Department
        of Psychiatry, Affiliated Kangning Hospital of Ningbo University (Ningbo Kangning
        Hospital), Ningbo, 315201, Zhejiang, China. Electronic address: wyzhouds@sina.com.\"}]}},{\"fullName\":\"Zhang
        M\",\"lastName\":\"Zhang\",\"firstName\":\"Mingjun\",\"initials\":\"M\",\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Department
        of Psychiatry, The Second People's Hospital of Zhoushan, Zhoushan, 316100,
        Zhejiang, China. Electronic address: lczxwsy@126.com.\"}]}}]},\"authorIdList\":{\"authorId\":[{\"type\":\"ORCID\",\"value\":\"0009-0002-9326-4242\"}]},\"journalInfo\":{\"volume\":\"193\",\"journalIssueId\":4082238,\"dateOfPublication\":\"2026
        Feb\",\"monthOfPublication\":2,\"yearOfPublication\":2026,\"journal\":{\"medlineAbbreviation\":\"J
        Psychiatr Res\",\"title\":\"Journal of psychiatric research\",\"essn\":\"1879-1379\",\"issn\":\"0022-3956\",\"nlmid\":\"0376331\",\"isoabbreviation\":\"J
        Psychiatr Res\"},\"printPublicationDate\":\"2026-02-01\"},\"pubYear\":\"2026\",\"pageInfo\":\"405-413\",\"abstractText\":\"<h4>Objective</h4>Compared
        to depression, adolescents with anxious depression more severe impairments
        across multiple domains. This study illustrates differences in brain activity
        patterns among depressed adolescents with varying levels of anxiety.<h4>Method</h4>A
        total of 196 adolescents with depression were recruited, including 67 in the
        low anxious depression group (LAD), 87 in the moderate anxious depression
        group (MAD), and 42 in the high anxious depression group (HAD). We utilized
        functional near-infrared spectroscopy (fNIRS) to monitor oxyhemoglobin (Oxy-Hb)
        changes in participants' brains while they performed the verbal fluency task
        (VFT).<h4>Results</h4>High anxious depression adolescents exhibited significantly
        lower Oxy-Hb activation in Brodmann Areas 10 (BA 10) (F\_=\_7.073, pFDR\_=\_0.001)
        and 46 (BA 46) (F\_=\_11.668, pFDR < 0.001) compared to those with low anxious
        depression. During the VFT, the HAM-A score was negatively correlated with
        Oxy-Hb levels in BA 10 (r\_=\_-0.234, pFDR\_=\_0.006) and BA 46 (r\_=\_-0.320,
        pFDR < 0.001). In the initiation phase, the activation level of the LAD in
        BA 10 was higher than that of the HAD (pFDR < 0.020), and in BA 46, it was
        higher than both the HAD (pFDR < 0.001) and MAD (pFDR\_=\_0.015). In the maintenance
        phase, LAD activation in BA 10 was higher than HAD (pFDR\_=\_0.019) and MAD
        (pFDR\_=\_0.001), while BA 46 activation was higher than HAD (pFDR\_=\_0.027).<h4>Conclusions</h4>The
        study revealed that adolescents with high anxious depression had significantly
        lower Oxy-Hb levels in the PFC (specifically BA 10 and BA 46) compared to
        those with low anxious depression, providing neurophysiological evidence for
        the negative impact of anxiety on attention control. The results may aid in
        distinguish adolescents with varying anxiety levels and offer potential personalized
        intervention targets for non-invasive brain stimulation (NIBS).\",\"affiliation\":\"Department
