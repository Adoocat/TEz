        of Radiology, People's Hospital of Xinjiang Uygur Autonomous Region, Urumqi,
        Xinjiang,\_China.\"}]}}]},\"dataLinksTagsList\":{\"dataLinkstag\":[\"supporting_data\"]},\"journalInfo\":{\"volume\":\"17\",\"journalIssueId\":4112086,\"dateOfPublication\":\"2026
        \",\"monthOfPublication\":0,\"yearOfPublication\":2026,\"journal\":{\"medlineAbbreviation\":\"Front
        Psychiatry\",\"title\":\"Frontiers in psychiatry\",\"essn\":\"1664-0640\",\"issn\":\"1664-0640\",\"isoabbreviation\":\"Front
        Psychiatry\",\"nlmid\":\"101545006\"},\"printPublicationDate\":\"2026-01-01\"},\"pubYear\":\"2026\",\"pageInfo\":\"1844684\",\"abstractText\":\"<h4>Objective</h4>To
        develop a multimodal deep learning-based classification model for adolescent
        bipolar depression (ABD) with verbal auditory hallucinations (AVHs).<h4>Methods</h4>A
        retrospective analysis was conducted on 47 untreated ABD patients within 30
        days, between January 2024 and August 2025. Comprehensive clinical data were
        collected, including sex, age, age at onset, years of education, and the presence
        of suicidal or self-harming behaviors. Based on the PANSS P3 score and the
        presence of AVHs, patients were divided into a hallucination group (P3 score
        > 3, n = 24) and a non-hallucination group (P3 score \u2264 3, n = 23). All
        participants underwent 1H-MRS scanning of the ventromedial prefrontal cortex
        (vmPFC). A multimodal deep learning model was constructed using MRS-derived
        features in combination with clinical parameters.<h4>Results</h4>The model
        achieved an optimal classification accuracy of 71.43% on the fixed test set,
        as obtained by the second-fold model. This best-performing model demonstrated
        balanced and stable classification performance for both positive and negative
        samples, with precision, recall, and F1-score all reaching 0.75.<h4>Conclusion</h4>This
        study proposes a novel multimodal Transformer-based framework and evaluates
        its effectiveness in classifying ABD patients experiencing depressive episodes
        with AVHs. The results suggest that the advanced model architecture, incorporating
        mechanisms such as bidirectional cross-attention and an Ensemble of Experts
        classifier, can effectively integrate heterogeneous data and achieve a test
        accuracy of 71.43% on a small dataset, indicating preliminary technical feasibility.\",\"affiliation\":\"Graduate
        School, Xinjiang Medical University, \xDCr\xFCmqi, Xinjiang,\_China.\",\"publicationStatus\":\"epublish\",\"language\":\"eng\",\"pubModel\":\"Electronic-eCollection\",\"pubTypeList\":{\"pubType\":[\"research-article\",\"Journal
        Article\"]},\"keywordList\":{\"keyword\":[\"Adolescent\",\"Bipolar Depression\",\"magnetic
        resonance spectroscopy\",\"Deep Learning\",\"Verbal Auditory Hallucinations\"]},\"fullTextUrlList\":{\"fullTextUrl\":[{\"availability\":\"Subscription
