        Hui Z.\",\"authorList\":{\"author\":[{\"fullName\":\"Gao-Yue R\",\"lastName\":\"Gao-Yue\",\"firstName\":\"Ren\",\"initials\":\"R\",\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Department
