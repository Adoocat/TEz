        (Berl)\",\"title\":\"Psychopharmacology\",\"essn\":\"1432-2072\",\"issn\":\"0033-3158\",\"nlmid\":\"7608025\",\"isoabbreviation\":\"Psychopharmacology
        (Berl)\"},\"printPublicationDate\":\"2024-12-01\"},\"pubYear\":\"2024\",\"pageInfo\":\"2513-2523\",\"abstractText\":\"<h4>Rationale</h4>Alcohol
        exposure during adolescence has been linked to long-lasting behavioral consequences,
        contributing to the development of alcohol use disorder. Negative affect and
        chronic pain during alcohol withdrawal are critical factors influencing problematic
        alcohol use and relapse. Our previous research demonstrated that adolescent
        intermittent ethanol (AIE) vapor exposure elicits sex-specific negative affect-like
        behavior in adult mice following stress exposure. Additionally, AIE induces
        persistent mechanical hypersensitivity, which is accompanied by increased
        activation of corticotropin-releasing factor receptor type 1 (CRFR1) neurons
        in the dorsolateral bed nucleus of the stria terminalis (dlBNST).<h4>Objectives</h4>This
        study extends previous work by investigating plasma corticosterone levels
        and CRFR1 protein expression in the dlBNST following restraint stress exposure
        in adult mice with an AIE history. We also aim to explore the role of dlBNST
        CRFR1 signaling in mediating negative affect-like behavior and mechanical
        hypersensitivity.<h4>Results</h4>Female mice exhibited elevated plasma corticosterone
        levels compared to males following restraint stress. Moreover, females with
        AIE history showed higher expression of CRFR1 protein in the dlBNST compared
        to air controls. Antagonism of CRFR1 in the dlBNST blocked AIE-induced mechanical
        hypersensitivity in adult females but did not affect stress-induced negative
        affect-like behavior. In alcohol-na\xEFve females, intra-dlBNST administration
        of a CRFR1 agonist induced mechanical hypersensitivity.<h4>Conclusions</h4>These
        findings provide new insights into the neurobiological mechanisms underlying
        stress-induced negative affect and pain-related behavior, both influenced
        by a history of adolescent alcohol exposure. The results suggest that CRFR1
        antagonists warrant further investigation for their potential in addressing
        alcohol-related chronic pain.\",\"affiliation\":\"Department of Cell Biology
        & Anatomy, School of Medicine, Louisiana State University Health Sciences
        Center, 533 Bolivar Street, New Orleans, LA, 70112, USA.\",\"publicationStatus\":\"ppublish\",\"language\":\"eng\",\"pubModel\":\"Print-Electronic\",\"pubTypeList\":{\"pubType\":[\"research-article\",\"Journal
