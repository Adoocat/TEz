        EIdType="doi" ValidYN="Y">10.13109/prkk.2024.73.2.114</ELocationID><Abstract><AbstractText>Development
        and Evaluation of an Information Brochure on Anxiety and Anxiety Disorders
        for Adolescents Low mental health literacy and fear of being stigmatized are
        two main barriers that detain adolescents fromseeking professional help. An
        information brochure about anxiety disorders for adolescents was developed.
        To make a first statement about the quality of the brochure, 19 experts, consisting
        of (child and adolescents) psychotherapists, psychiatrists, and psychologists,
        rated a first version of the brochure regarding content validity and age-appropriatness.
        To evaluate the efficacy in knowledge and the acceptance of the brochure,
        a revised version was evaluated by N = 174 adolscents (106 female-, 66 male-
        and two non-binary) between 14 and 17 years of age (M = 16.56 years.; SD =
        0.57).The experts'' approval of all content items totals a mean average of
        95.2 % (range: 84.2-100 %). In the adolescent sample, the intervention increased
        knowledge about anxiety disorders (d = 1.04) and improved attitudes about
        coping strategies (d = 0.99). Results of the experts'' rating showed that
        content validity of the brochure can be assumed.The revised brochure seems
        to be a useful and effective tool to inform adolescents about anxiety disorders.</AbstractText></Abstract><AuthorList
