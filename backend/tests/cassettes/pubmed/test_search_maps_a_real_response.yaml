        Type="Publisher" Language="ger"><AbstractText>Zusammenfassung Geringe psychische
        Gesundheitskompetenz und Angst vor Stigmatisierung sind fur Jugendliche Barrieren
        zur Aufnahme einer Psychotherapie. Eine Informationsbroschure zu Angststorungen
        &#x201e;Alles, was du uber Angst wissen solltest und wie du sie uberwinden
        kannst&#x201c; wurde entwickelt und von 19 Expert:innen (Kinder- und Jugendlichenpsychotherapeut:innen,
        Psycholog:innen, Psychiater:innen) bewertet. Eine uberarbeitete Version wurde
        anschliesend von 174 Jugendlichen (14- 17 Jahre; 106 weiblich, 66 mannlich,
        2 divers) gelesen und bezuglich Einstellungs- und Wissensveranderung untersucht.
        Die Ruckmeldungen der Expert:innen waren uberwiegend positiv. Die Jugendlichen
        konnten durch das Lesen der Broschure ihr Wissen zu Angststorungen signifikant
        steigern, p &lt; .001, d = 1.05 und ihre Einstellung zu Bewaltigungsstrategien
        verbessern, p &lt; .001, d = 0.99. Die Broschure kann dazu beitragen,Wissen
        zu vermitteln und Barrieren zu reduzieren.</AbstractText></OtherAbstract><KeywordList
