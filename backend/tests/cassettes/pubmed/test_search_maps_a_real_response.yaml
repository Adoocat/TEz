        behaviors</Title><ISOAbbreviation>Addict Behav</ISOAbbreviation></Journal><ArticleTitle>Problematic
        social media use in childhood and adolescence.</ArticleTitle><Pagination><StartPage>107980</StartPage><MedlinePgn>107980</MedlinePgn></Pagination><ELocationID
        EIdType="doi" ValidYN="Y">10.1016/j.addbeh.2024.107980</ELocationID><ELocationID
        EIdType="pii" ValidYN="Y">S0306-4603(24)00029-7</ELocationID><Abstract><AbstractText>At
        the time of writing, about 4.59 billion people use social media with many
        adolescents using their social media accounts across a myriad of applications
        and platforms. According to recent statistics, in 2022 individuals spent an
        average of 151 minutes on social media each day, illustrating the global relevance
        of social media (Dixon, 2022a,b). One of the pressing questions, internationally,
        is whether social media use is harmful and/or addictive. This question is
        of particular importance because many teenagers - and younger adolescents
        - spend considerable time on these platforms, which have increasingly become
        an integral part of their lives. Moreover, considering lifespan development,
        adolescents may be particularly vulnerable to specific features and advertisements
        shown to them on social media platforms. Growing prevalence of poor mental
        health in young people has led to recent recommendations in the United States
        to routinely screen for anxiety in 8-18 year olds, and for depression and
        suicide risk for adolescents between 12-18 years of age (US Preventive Services
        Task Force et al., 2022 a,b) - the conditions often accompanying problematic
        social media use. The present work not only provides insights into the current
        state of the literature but provides also recommendations.</AbstractText><CopyrightInformation>Copyright
        &#xa9; 2024 The Author(s). Published by Elsevier Ltd.. All rights reserved.</CopyrightInformation></Abstract><AuthorList
