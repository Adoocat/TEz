        <PubmedArticle><MedlineCitation Status="MEDLINE" Owner="NLM" IndexingMethod="Manual"><PMID
        Version="1">11126856</PMID><DateCompleted><Year>2001</Year><Month>01</Month><Day>11</Day></DateCompleted><DateRevised><Year>2026</Year><Month>01</Month><Day>28</Day></DateRevised><Article
