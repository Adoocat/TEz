        of affective disorders</Title><ISOAbbreviation>J Affect Disord</ISOAbbreviation></Journal><ArticleTitle>Global
        burden of depression or depressive symptoms in children and adolescents: A
        systematic review and meta-analysis.</ArticleTitle><Pagination><StartPage>553</StartPage><EndPage>562</EndPage><MedlinePgn>553-562</MedlinePgn></Pagination><ELocationID
        EIdType="doi" ValidYN="Y">10.1016/j.jad.2024.03.074</ELocationID><ELocationID
        EIdType="pii" ValidYN="Y">S0165-0327(24)00489-0</ELocationID><Abstract><AbstractText
        Label="BACKGROUND">Depression is the leading cause of health-related disability.
        A proportion of depression cases begin in childhood and increase dramatically
        during adolescence. This systematic review and meta-analysis aimed to estimate
        the global prevalence of depression or depressive symptoms in children and
        adolescents and explore the temporal and regional distribution of depression
        or depressive symptoms.</AbstractText><AbstractText Label="METHODS">This systematic
        review and meta-analysis identified peer-reviewed literature published through
        April 8, 2023, using the MEDLINE, Embase and APA PsycINFO databases, supplemented
        by reverse reference searches. Observational studies published in English
        and based on validated instruments with prevalence data on depression or depressive
        symptoms in children and adolescents aged &#x2264;18&#xa0;years were eligible.
        Random-effects meta-analysis and meta-regression analysis were performed using
        R software.</AbstractText><AbstractText Label="RESULTS">This systematic review
        and meta-analysis included a total of 96 studies (29 countries, 528,293 participants)
        published between 1989 and 2022. The pooled prevalence of mild-to-severe,
        moderate-to-severe, and major depression were 21.3&#xa0;% (95%CI, 16.7&#xa0;%-26.7&#xa0;%),
        18.9&#xa0;% (95%CI, 14.6&#xa0;%-24.2&#xa0;%), and 3.7&#xa0;% (95%CI, 2.7&#xa0;%-5.1&#xa0;%)
        respectively. Meta-regression analysis showed that from 1989 to 2022, the
        prevalence of mild-to-severe and moderate-to-severe depression increased over
        time (P&#xa0;=&#xa0;0.002, P&#xa0;=&#xa0;0.034, respectively), but the prevalence
        of major depression did not change significantly (P&#xa0;=&#xa0;0.636).</AbstractText><AbstractText
        Label="LIMITATIONS">Only English articles were included. There was significant
        heterogeneity across the included studies. The studies included were mostly
        based on self-report scales to assess depressive symptoms.</AbstractText><AbstractText
        Label="CONCLUSION">In this systematic review, about one in five children and
        adolescents globally suffered from depression or had depressive symptoms,
        and this proportion was increasing over time.</AbstractText><CopyrightInformation>Copyright
        &#xa9; 2024 Elsevier B.V. All rights reserved.</CopyrightInformation></Abstract><AuthorList
