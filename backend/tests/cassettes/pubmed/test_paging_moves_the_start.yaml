        <PubmedArticle><MedlineCitation Status="MEDLINE" Owner="NLM" IndexingMethod="Automated"><PMID
        Version="1">34569066</PMID><DateCompleted><Year>2022</Year><Month>04</Month><Day>19</Day></DateCompleted><DateRevised><Year>2026</Year><Month>01</Month><Day>27</Day></DateRevised><Article
        PubModel="Print-Electronic"><Journal><ISSN IssnType="Print">0144-6657</ISSN><JournalIssue
        CitedMedium="Internet"><Volume>61</Volume><Issue>2</Issue><PubDate><Year>2022</Year><Month>Jun</Month></PubDate></JournalIssue><Title>The
        British journal of clinical psychology</Title><ISOAbbreviation>Br J Clin Psychol</ISOAbbreviation></Journal><ArticleTitle>Global
        prevalence of depression and elevated depressive symptoms among adolescents:
        A systematic review and meta-analysis.</ArticleTitle><Pagination><StartPage>287</StartPage><EndPage>305</EndPage><MedlinePgn>287-305</MedlinePgn></Pagination><ELocationID
        EIdType="doi" ValidYN="Y">10.1111/bjc.12333</ELocationID><Abstract><AbstractText
        Label="OBJECTIVE" NlmCategory="OBJECTIVE">Adolescence is a formative and turbulent
        phase where physiological, psychosocial, and cognitive changes leave adolescents
        vulnerable to psychological disorders. Given the lack of reviews that consolidate
        and compare worldwide prevalence of depression among adolescents, this review
        aims to examine the global prevalence of major depressive disorders, dysthymia,
        and elevated depressive symptoms among adolescents.</AbstractText><AbstractText
        Label="METHODS" NlmCategory="METHODS">A systematic review and meta-analysis
        was conducted. Six databases were searched for studies published from 2001
        to December 2020. Seventy-two studies were included. Subgroup analysis were
        performed for year of publication, geographical region, gender, and assessment
        tools used.</AbstractText><AbstractText Label="RESULTS" NlmCategory="RESULTS">The
        global point prevalence rate of elevated self-reported depressive symptoms
        from 2001 to 2020 was 34% (95% CI: 0.30-0.38). Point prevalence for major
        depressive disorder (MDD) and dysthymia was 8% (95% CI: 0.02-0.13) and 4%
        (95% CI: 0.01-0.07), respectively. The pooled one-year prevalence and lifetime
        prevalence for MDD were 8% (95% CI: 0.05-0.12) and 19% (95% CI: 0.12-0.26).
        Point prevalence of elevated depressive symptoms among adolescents increased
        from 24% (95% CI: 0.19-0.28) between 2001 and 2010 to 37% (95% CI: 0.32-0.42)
        between 2011 and 2020. The Middle East, Africa, and Asia have the highest
        prevalence of elevated depressive symptoms, and female adolescents were reported
        to have a higher prevalence of elevated depressive symptoms than male adolescents.</AbstractText><AbstractText
        Label="CONCLUSION" NlmCategory="CONCLUSIONS">Besides targeting those with
        existing clinical depression, research and policies should also focus on educational
        and supportive mitigation efforts to curb depressive symptoms among adolescents
        before escalation. The findings encourage future research to develop more
        gender-specific and culturally relevant intervention programmes.</AbstractText><AbstractText
        Label="PRACTITIONER POINTS" NlmCategory="CONCLUSIONS">34% of adolescents globally,
        aged 10-19&#x2009;years, are at risk of developing clinical depression, which
        exceeds the reported estimates of individuals aged 18 to 25&#x2009;years.
        Practitioners are highly encouraged to prioritize depression screening and
        intervention implementation for individuals in this age group. Female adolescents
        and adolescents from Middle East, Africa, and Asia have the highest risk of
        developing depression. This urges practitioners and researchers to develop
        more gender-specific and culturally relevant intervention programmes.</AbstractText><CopyrightInformation>&#xa9;
        2021 The British Psychological Society.</CopyrightInformation></Abstract><AuthorList
