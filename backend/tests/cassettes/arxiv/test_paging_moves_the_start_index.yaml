        \ Milicevic</name>\n    </author>\n    <author>\n      <name>Adam Nirving\
        \ Davidsson</name>\n    </author>\n    <author>\n      <name>Chih-Hong Cheng</name>\n\
        \    </author>\n  </entry>\n</feed>\n"
