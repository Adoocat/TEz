        \      <name>Shuai Jia</name>\n    </author>\n    <author>\n      <name>Yujie\
        \ Ding</name>\n    </author>\n    <author>\n      <name>Dongming Han</name>\n\
        \    </author>\n    <author>\n      <name>Tianyi Ma</name>\n    </author>\n\
        \    <author>\n      <name>Bin Cao</name>\n    </author>\n  </entry>\n</feed>\n"
