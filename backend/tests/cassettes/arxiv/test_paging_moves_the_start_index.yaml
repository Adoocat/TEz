        \  <entry>\n    <id>http://arxiv.org/abs/2505.16339v1</id>\n    <title>Rethinking\
        \ Code Review Workflows with LLM Assistance: An Empirical Study</title>\n\
        \    <updated>2025-05-22T07:54:07Z</updated>\n    <link href=\"https://arxiv.org/abs/2505.16339v1\"\
        \ rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2505.16339v1\"\
        \ rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>Code\
        \ reviews are a critical yet time-consuming aspect of modern software development,\
        \ increasingly challenged by growing system complexity and the demand for\
        \ faster delivery. This paper presents a study conducted at WirelessCar Sweden\
        \ AB, combining an exploratory field study of current code review practices\
        \ with a field experiment involving two variations of an LLM-assisted code\
        \ review tool. The field study identifies key challenges in traditional code\
        \ reviews, including frequent context switching, insufficient contextual information,\
        \ and highlights both opportunities (e.g., automatic summarization of complex\
        \ pull requests) and concerns (e.g., false positives and trust issues) in\
        \ using LLMs. In the field experiment, we developed two prototype variations:\
        \ one offering LLM-generated reviews upfront and the other enabling on-demand\
        \ interaction. Both utilize a semantic search pipeline based on retrieval-augmented\
        \ generation to assemble relevant contextual information for the review, thereby\
        \ tackling the uncovered challenges. Developers evaluated both variations\
        \ in real-world settings: AI-led reviews are overall more preferred, while\
        \ still being conditional on the reviewers' familiarity with the code base,\
        \ as well as on the severity of the pull request.</summary>\n    <category\
        \ term=\"cs.SE\" scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2025-05-22T07:54:07Z</published>\n\
