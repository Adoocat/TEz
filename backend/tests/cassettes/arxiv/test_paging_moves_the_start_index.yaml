        \  <entry>\n    <id>http://arxiv.org/abs/2602.13377v1</id>\n    <title>A Survey\
        \ of Code Review Benchmarks and Evaluation Practices in Pre-LLM and LLM Era</title>\n\
        \    <updated>2026-02-13T18:19:38Z</updated>\n    <link href=\"https://arxiv.org/abs/2602.13377v1\"\
        \ rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2602.13377v1\"\
        \ rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>Code\
        \ review is a critical practice in modern software engineering, helping developers\
        \ detect defects early, improve code quality, and facilitate knowledge sharing.\
        \ With the rapid advancement of large language models (LLMs), a growing body\
        \ of work has explored automated support for code review. However, progress\
        \ in this area is hindered by the lack of a systematic understanding of existing\
        \ benchmarks and evaluation practices. Current code review datasets are scattered,\
        \ vary widely in design, and provide limited insight into what review capabilities\
        \ are actually being assessed. In this paper, we present a comprehensive survey\
        \ of code review benchmarks spanning both the Pre-LLM and LLM eras (2015--2025).\
        \ We analyze 99 research papers (58 Pre-LLM era and 41 LLM era) and extract\
        \ key metadata, including datasets, evaluation metrics, data sources, and\
        \ target tasks. Based on this analysis, we propose a multi-level taxonomy\
        \ that organizes code review research into five domains and 18 fine-grained\
        \ tasks. Our study reveals a clear shift toward end-to-end generative peer\
        \ review, increasing multilingual coverage, and a decline in standalone change\
        \ understanding tasks. We further identify limitations of current benchmarks\
        \ and outline future directions, including broader task coverage, dynamic\
        \ runtime evaluation, and taxonomy-guided fine-grained assessment. This survey\
        \ provides a structured foundation for developing more realistic and comprehensive\
        \ benchmarks for LLM-based code review.</summary>\n    <category term=\"cs.SE\"\
        \ scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2026-02-13T18:19:38Z</published>\n\
        \    <arxiv:primary_category term=\"cs.SE\"/>\n    <author>\n      <name>Taufiqul\
        \ Islam Khan</name>\n    </author>\n    <author>\n      <name>Shaowei Wang</name>\n\
        \    </author>\n    <author>\n      <name>Haoxiang Zhang</name>\n    </author>\n\
        \    <author>\n      <name>Tse-Hsun Chen</name>\n    </author>\n  </entry>\n\
        \  <entry>\n    <id>http://arxiv.org/abs/2512.17540v2</id>\n    <title>SGCR:\
        \ A Specification-Grounded Framework for Trustworthy LLM Code Review</title>\n\
        \    <updated>2026-01-27T12:43:31Z</updated>\n    <link href=\"https://arxiv.org/abs/2512.17540v2\"\
        \ rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2512.17540v2\"\
        \ rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>Automating\
        \ code review with Large Language Models (LLMs) shows immense promise, yet\
        \ practical adoption is hampered by their lack of reliability, context-awareness,\
        \ and control. To address this, we propose Specification-Grounded Code Review\
        \ (SGCR), a framework that grounds LLMs in human-authored specifications to\
        \ produce trustworthy and relevant feedback. SGCR features a novel dual-pathway\
        \ architecture: an explicit path ensures deterministic compliance with predefined\
        \ rules derived from these specifications, while an implicit path heuristically\
        \ discovers and verifies issues beyond those rules. Deployed in a live industrial\
        \ environment at HiThink Research, SGCR's suggestions achieved a 42% developer\
        \ adoption rate-a 90.9% relative improvement over a baseline LLM (22%). Our\
        \ work demonstrates that specification-grounding is a powerful paradigm for\
        \ bridging the gap between the generative power of LLMs and the rigorous reliability\
        \ demands of software engineering.</summary>\n    <category term=\"cs.SE\"\
        \ scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2025-12-19T13:02:22Z</published>\n\
        \    <arxiv:comment>Accepted at ASE 2025</arxiv:comment>\n    <arxiv:primary_category\
        \ term=\"cs.SE\"/>\n    <author>\n      <name>Kai Wang</name>\n    </author>\n\
