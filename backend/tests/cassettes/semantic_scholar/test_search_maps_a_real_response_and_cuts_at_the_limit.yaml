        "title": "RefactorAI: An Autonomous Code Modernization Agent", "venue": "International
        Journal for Research in Applied Science and Engineering Technology", "year":
        2026, "citationCount": 0, "openAccessPdf": {"url": "https://doi.org/10.22214/ijraset.2026.79005",
        "status": "GOLD", "license": null, "disclaimer": "Notice: Paper or abstract
