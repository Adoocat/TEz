        "publicationTypes": ["JournalArticle", "Book", "Review"], "journal": {"name":
        "Proceedings of the 28th International Conference on Evaluation and Assessment
        in Software Engineering"}, "authors": [{"authorId": "2306789863", "name":
        "Miku Watanabe"}, {"authorId": "40293906", "name": "Yutaro Kashiwa"}, {"authorId":
        "2274119728", "name": "Bin Lin"}, {"authorId": "1978134", "name": "Toshiki
        Hirao"}, {"authorId": "2116784234", "name": "Ken''Ichi Yamaguchi"}, {"authorId":
        "2273975187", "name": "Hajimu Iida"}], "abstract": "Code review is a critical
        but time-consuming process for ensuring code quality in modern software engineering.
        To alleviate the effort of reviewing source code, recent studies have investigated
        the possibility of automating the review process. Moreover, tools based on
        large language models such as ChatGPT are playing an increasingly important
        role in this vision. Understanding how these tools are used during code review
        can provide valuable insights for code review automation. This study investigates
        for what purposes developers use ChatGPT during code review and how developers
        react to the information and suggestions provided by ChatGPT. We manually
        analyze 229 review comments in 205 pull requests from 179 projects. We find
        that developers often use ChatGPT for outsourcing their work as frequently
        as asking for references. Moreover, we observe that only 30.7% of responses
        to the answers provided by ChatGPT are negative. We further analyze the reasons
        behind the negative reactions. Our results provide valuable insights for improving
        the effectiveness of LLMs in code reviews."}, {"paperId": "05bccbc8007cef45c1edb7e7e93bfe26ecd898ab",
        "externalIds": {"DBLP": "journals/corr/abs-2604-05955", "ArXiv": "2604.05955",
        "DOI": "10.48550/arXiv.2604.05955", "CorpusId": 287209367}, "publicationVenue":
        {"id": "1901e811-ee72-4b20-8f7e-de08cd395a10", "name": "arXiv.org", "alternate_names":
        ["ArXiv"], "issn": "2331-8422", "url": "https://arxiv.org"}, "url": "https://www.semanticscholar.org/paper/05bccbc8007cef45c1edb7e7e93bfe26ecd898ab",
        "title": "Does Pass Rate Tell the Whole Story? Evaluating Design Constraint
        Compliance in LLM-based Issue Resolution", "venue": "arXiv.org", "year": 2026,
        "citationCount": 6, "openAccessPdf": {"url": "", "status": null, "license":
        null, "disclaimer": "Notice: Paper or abstract available at https://arxiv.org/abs/2604.05955,
        which is subject to the license by the author or copyright owner provided
        with this content. Please go to the source to verify the license and copyright
        information for your use."}, "publicationTypes": ["JournalArticle", "Review"],
        "journal": {"name": "ArXiv", "volume": "abs/2604.05955"}, "authors": [{"authorId":
        "2324224519", "name": "Kai Yu"}, {"authorId": "2296659524", "name": "Zhen-Hao
        Zhou"}, {"authorId": "2314347311", "name": "Jun-Hao Zeng"}, {"authorId": "2266161260",
        "name": "Ying Wang"}, {"authorId": "2133930029", "name": "Xue-Ying Du"}, {"authorId":
        "2176159206", "name": "Zhi-Qiang Yuan"}, {"authorId": "2226464443", "name":
        "Jun-Wei Liu"}, {"authorId": "2341558385", "name": "Ziyu Zhou"}, {"authorId":
        "2353558781", "name": "Yu-Jia Wang"}, {"authorId": "2348700362", "name": "Chong
        Wang"}, {"authorId": "2326640942", "name": "Xin Peng"}], "abstract": "Repository-level
        issue resolution benchmarks have become a standard testbed for evaluating
        LLM-based agents, yet success is still predominantly measured by test pass
        rates. In practice, however, acceptable patches must also comply with project-specific
        design constraints, such as architectural conventions, error-handling policies,
        and maintainability requirements, which are rarely encoded in tests and are
        often documented only implicitly in code review discussions. This paper introduces
        \\textit{design-aware issue resolution} and presents \\bench{}, a benchmark
        that makes such implicit design constraints explicit and measurable. \\bench{}
        is constructed by mining and validating design constraints from real-world
        pull requests, linking them to issue instances, and automatically checking
        patch compliance using an LLM-based verifier, yielding 495 issues and 1,787
        validated constraints across six repositories, aligned with SWE-bench-Verified
        and SWE-bench-Pro. Experiments with state-of-the-art agents show that test-based
        correctness substantially overestimates patch quality: fewer than half of
        resolved issues are fully design-satisfying, design violations are widespread,
        and functional correctness exhibits negligible statistical association with
        design satisfaction. While providing issue-specific design guidance reduces
        violations, substantial non-compliance remains, highlighting a fundamental
        gap in current agent capabilities and motivating design-aware evaluation beyond
        functional correctness."}]}'
