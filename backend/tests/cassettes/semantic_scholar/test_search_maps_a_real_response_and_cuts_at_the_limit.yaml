        "journal": {"name": "ArXiv", "volume": "abs/2507.19902"}, "authors": [{"authorId":
        "2217185453", "name": "S. Khanzadeh"}], "abstract": "Software development
        is a complex, multi-phase process traditionally requiring collaboration among
        individuals with diverse expertise. We propose AgentMesh, a Python-based framework
        that uses multiple cooperating LLM-powered agents to automate software development
        tasks. In AgentMesh, specialized agents - a Planner, Coder, Debugger, and
        Reviewer - work in concert to transform a high-level requirement into fully
        realized code. The Planner agent first decomposes user requests into concrete
        subtasks; the Coder agent implements each subtask in code; the Debugger agent
        tests and fixes the code; and the Reviewer agent validates the final output
        for correctness and quality. We describe the architecture and design of these
        agents and their communication, and provide implementation details including
        prompt strategies and workflow orchestration. A case study illustrates AgentMesh
        handling a non-trivial development request via sequential task planning, code
        generation, iterative debugging, and final code review. We discuss how dividing
        responsibilities among cooperative agents leverages the strengths of large
        language models while mitigating single-agent limitations. Finally, we examine
        current limitations - such as error propagation and context scaling - and
        outline future work toward more robust, scalable multi-agent AI systems for
        software engineering automation."}, {"paperId": "0182514f6db322445966b1a35e72256f96bb9d35",
        "externalIds": {"DOI": "10.22214/ijraset.2026.79005", "CorpusId": 287488029},
        "publicationVenue": {"id": "100ffd12-b334-4f02-826b-8ac408e7df49", "name":
