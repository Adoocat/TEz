        "L. Mariotto"}, {"authorId": "47671381", "name": "C. M. Adriano"}, {"authorId":
        "2404521611", "name": "René Eichhorn"}, {"authorId": "1889613", "name": "Daniel
        Burgstahler"}, {"authorId": "2300124255", "name": "Holger Giese"}], "abstract":
        "Background] Efficient code review is essential in industrial software development,
        but writing high-quality Pull Request (PR) descriptions aligned with core
        software engineering competencies remains challenging. [Aims] To investigate
        Large Language Models (LLMs) as a reliable PR description assistant, we examined
        two research problems: (1) how developer competencies relate to real-world
        PR quality, and (2) how developers perceive PR quality and their variants
        (LLM-Improved). [Methods] We adopted six software engineering competencies
        to prompt six LLMs to score 212,687 PRs from 82 opensource projects spanning
        three repository archetypes. From these, we selected the top six PRs for a
        controlled experiment with 38 software professionals, using a $6 \\times 6$
        Latin square design to measure preferences. The LLMs generated three variants
        of each original (O) PR: degraded (D), improved from the original (IO), and
        improved from the degraded (ID). We then compared these variants across LLMs
        for semantic, lexical, and stylistic similarity. [Results] Surprisingly, our
        controlled experiment with 38 software professionals showed that the ID variant
        was rated significantly higher than both the Original PR (O) and the LLMDegraded
        (D) one. However, the IO variant was not significantly better, and participants
        complained about their verbosity and the “AI tone”. Concerning generalizability,
        the six LLMs produced semantically similar PRs, but with high lexical and
        stylistic variation. [Conclusions] This suggests LLMs can enhance PR by providing
        missing structure but require guidance to retain human nuance. Overall, our
        findings support human-centered, modelaware integration of LLMs to strengthen
        competency-aligned code review."}, {"paperId": "04014eb4eb633be610edce0e125f307e8af097de",
