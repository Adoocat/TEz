        or https://doi.org/10.22214/ijraset.2026.79005, which is subject to the license
        by the author or copyright owner provided with this content. Please go to
        the source to verify the license and copyright information for your use."},
        "publicationTypes": ["JournalArticle", "Review"], "journal": {"name": "International
        Journal for Research in Applied Science and Engineering Technology"}, "authors":
        [{"authorId": "2473611076", "name": "H. Reddy"}], "abstract": "Legacy software
        systems form the backbone of many organizations, yet over time they accumulate
        significant technical\ndebt due to outdated architectures, inefficient design
        patterns, and evolving business requirements. This technical debt increases\nmaintenance
        costs, reduces system scalability, and slows down innovation. Manual code
        review and refactoring processes are\noften time-consuming, error-prone, and
        heavily dependent on developer expertise, making large-scale modernization
        a\nchallenging task. To address these limitations, this project proposes RefactorAI,
        an autonomous code modernization agent\ndesigned to intelligently analyze,
        refactor, and modernize legacy codebases with minimal human intervention.
        RefactorAI\nintegrates static code analysis techniques with advanced Artificial
        Intelligence methods, including Abstract Syntax Trees (ASTs),\ndependency
        graphs, Graph Neural Networks (GNNs), and Large Language Models (LLMs). The
        system begins by parsing the\nsource code to extract structural and semantic
        information, constructing a comprehensive architectural and dependency model\nof
        the codebase. Using this representation, the agent identifies technical debt
        indicators such as tightly coupled modules, code\nsmells, and inefficient
        design patterns. An LLM-powered reasoning engine then analyzes these insights
        to generate strategic\nrefactoring recommendations, including component restructuring
        and architectural improvements such as monolith\ndecomposition. Beyond analysis
        and planning, RefactorAI autonomously generates modernized, syntactically
        correct code\nsnippets for targeted components, ensuring alignment with contemporary
        software development practices. This end-to-end\nautomation significantly
        reduces the manual effort required for software maintenance while improving
        code quality, scalability,\nand architectural integrity. The proposed system
        serves as a proof-of-concept demonstrating how AI-driven tools can accelerate\nthe
        software modernization lifecycle, enhance developer productivity, and enable
        organizations to extend the lifespan and value\nof their legacy systems. Ultimately,
        RefactorAI aims to empower development teams to maintain high software velocity
        while\neffectively managing technical debt in complex, real-world applications."},
