        "title": "On the Use of ChatGPT for Code Review: Do Developers Like Reviews
        By ChatGPT?", "venue": "International Conference on Evaluation & Assessment
        in Software Engineering", "year": 2024, "citationCount": 31, "openAccessPdf":
        {"url": "https://repository.ubn.ru.nl//bitstream/handle/2066/309005/309005.pdf",
        "status": "GREEN", "license": null, "disclaimer": "Notice: Paper or abstract
