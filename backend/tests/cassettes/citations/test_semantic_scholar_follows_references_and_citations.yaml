        "144975613", "name": "Ken-ichi Matsumoto"}], "abstract": "Software code review
        systems are commonly used in software development. In these systems, many
        patches are submitted to improve the quality. To verify the quality, voting
        is commonly used by contributors; however, there still exists a major problem,
        namely, that reviewers do not always simply reach a broad agreement. In our
        previous study, we found that consensus is not usually reached, implying that
        an individual reviewer\u2019s final decision usually differs from that of
        the majority of the other reviewers. In this study, we further investigate
        the reasons why such situations often occur, and provide suggestions for better
        handling of these problems. Our analysis of the Qt and OpenStack project datasets
        allow us to suggest that a patch owner should select more appropriate reviewers
        who often agree with others\u2019 decisions."}}]}

