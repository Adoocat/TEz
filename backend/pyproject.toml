[project]
name = "tez"
version = "0.1.0"
description = "TEz backend: API server, job worker and CLI"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1",
    "bibtexparser>=2.1",
    "fastapi>=0.162",
    "hishel[httpx2]>=1.4",
    "httpx2>=2.16",
    "keyring>=25",
    "pydantic-settings>=2",
    "pylatexenc>=2.10",
    "pypdfium2>=5.15",
    "rapidfuzz>=3.14",
    "rispy>=0.10",
    "sqlalchemy>=2",
    "tenacity>=9.2",
    "typer>=0.29",
    "uvicorn>=0.54",
]

[project.scripts]
tez = "tez.cli.main:main"
tez-backend = "tez.__main__:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "pytest>=9.2",
    "pytest-recording>=0.14",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17",
    "vcrpy>=9.4",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "BLE",          # blind `except Exception`
    "S110",         # try-except-pass
    "PTH",          # prefer pathlib
    "DTZ",          # timezone-aware datetimes
]
# Turkish text is first-class (dotless ı, dotted İ); not confusable look-alikes here.
allowed-confusables = ["ı", "İ"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src/tez"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
